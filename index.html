<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مصلح للتجارة</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="conatiner">
      <h2>مصلح للتجارة</h2>

      <div class="form-group">
        <label for="exchangeRate"
          >قيمة الدولار الحالية (بالليرة السورية) :</label
        >
        <input type="number" id="exchangeRate" placeholder="مثال : 1500" />
      </div>

      <table>
        <thead>
          <tr>
            <th>اسم المادة</th>
            <th>الكمية</th>
            <th>سعر الوحدة</th>
            <th id="usdHeader" style="display: none">المجموع (دولار)</th>
            <th>حذف</th>
          </tr>
        </thead>

        <tbody id="itemRows">
          <tr>
            <td>
              <input type="text" class="item-input" placeholder="اسم المادة" />
            </td>
            <td><input type="number" class="item-input qty" value="1" /></td>
            <td>
              <input
                type="number"
                class="item-input Price"
                placeholder="0.00"
              />
            </td>
            <td class="row-usd" style="display: none">$0.00</td>
            <td><button class="danger" onclick="removeRow(this)">X</button></td>
          </tr>
        </tbody>
      </table>

      <div style="display: flex; gap: 10px; margin-top: 10px">
        <button class="secondary" onclick="addRow()" style="flex: 1">
          اضافة مادة +
        </button>
        <button class="danger" onclick="clearAll()" style="flex: 1">
          مسح الكل
        </button>
      </div>

      <div class="btn-container">
        <button onclick="processOption1()">عرض في الجدول</button>
        <button onclick="processOption2()">عرض كايصال</button>
      </div>

      <div id="receiptBox" class="result-box">
        <h3 style="margin-top: 0; text-align: center">ملخص الفاتورة</h3>
        <div id="receiptList"></div>
        <div class="grand-total" id="receiptGrandTotal">المجموع : $0.00</div>
      </div>

      <div id="gridTotalBox" class="result-box" style="text-align: right">
        <span class="grand-total" id="gridGrandTotal"
          >المجموع بالدولار : $0.00</span
        >
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
